[package]
name = "n-library-gateway"
version = "0.1.0"
edition = "2021"
description = "N-LIBRARY Discord Bot — Rust Gateway (The Body)"

[dependencies]
poise = "0.6"
serenity = { version = "0.12", features = ["full", "voice"] }
songbird = { version = "0.6", features = ["receive", "builtin-queue"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
axum = "0.7"
hound = "3.5"
async-trait = "0.1.92"
symphonia = { version = "0.5.2", features = ["mp3"] }
